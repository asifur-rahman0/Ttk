/* Order status: open -> created (user claimed + picked wallet) -> success / failed / lock (admin decides). Old names are mapped. */
const NS = s => ({reserved:"created",done:"success",claimed:"success",rejected:"failed"})[s] || s;
/* order status: an order that has a TrxID but is still "created" counts as pending (old data) */
const OS = o => { const x = NS(o.status); return x==="created" && o.trxId ? "pending" : x; };
const ST = {created:["Created","#8a5a00","#fff3d6"],pending:["Pending","#0b5394","#d9edff"],success:["Success","#0b7a55","#e2f6ec"],failed:["Failed","#c0392b","#fdeceb"],lock:["Locked","#5a3d99","#ece6f7"],processing:["Processing","#0b5394","#dcefff"]};
const payLabel = m => m==="bkash" ? "bKash" : m==="nagad" ? "Nagad" : (m||"");
const findOrder = id => S.myOrders.find(x=>x.id===id) || S.orders.find(x=>x.id===id);
const isMine = o => OS(o)==="created" && o.claimedBy===S.user?.uid;
const hist = (status,note) => fb.arrayUnion({status, by:"user", uid:S.user.uid, at:Date.now(), note});
/* Account status set by admin: active / banned / suspended (cannot use app) / frozen / locked (view only, no new orders) */
const phoneShow = () => S.profile.phone || (S.user?.email||"").replace(/@nerivo\.local$/,"");
const accStatus = () => S.profile.accountStatus || (S.profile.disabled ? "banned" : "active");
const isOut = () => ["banned","suspended","deleted"].includes(accStatus());
const restricted = () => ["locked","frozen"].includes(accStatus());
const ACC_MSG = {
  deleted:["Account deleted","This account has been deleted. Contact support if you need help."],

function blockedView(){

/* Copy to clipboard. Tries the old textarea method first (works on http pages and iOS, must run right inside the tap),
   then the modern API. Resolves true if copied. */
function copyText(text){
  text = String(text ?? "");
  const prev = document.activeElement;
  let ok = false;
  try {
    const ios = /ipad|iphone|ipod/i.test(navigator.userAgent || "");
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("aria-hidden", "true");
    if (!ios) ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;left:0;top:0;width:2em;height:2em;padding:0;border:0;outline:0;box-shadow:none;background:transparent;opacity:.01;font-size:16px";
    document.body.appendChild(ta);
    if (ios) {
      ta.contentEditable = "true"; ta.readOnly = false;
      const r = document.createRange(); r.selectNodeContents(ta);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
      ta.setSelectionRange(0, 999999);
    } else { ta.focus(); ta.select(); ta.setSelectionRange(0, text.length); }
    ok = document.execCommand("copy");
    ta.remove();
    try { if (prev && prev.focus) prev.focus(); } catch {}
  } catch {}
  // also write through the modern clipboard API when the page allows it (https), so Gboard/clipboard managers see it
  try { if (navigator.clipboard && window.isSecureContext) { const pr = navigator.clipboard.writeText(text); if (ok) { pr.catch(()=>{}); return Promise.resolve(true); } return pr.then(() => true, () => false); } } catch {}
  return Promise.resolve(ok);
}

async function doRedeem(){
  if(S.redeeming) return;
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": redeem is disabled");
  const code = String(S.rcInput||"").trim().toUpperCase().replace(/\s+/g,"");
  if(!/^[A-Z0-9_-]{3,24}$/.test(code)) return toast("Enter a valid redeem code");
  if(DEMO) return toast("Demo mode: redeem works after Firebase is set up");
  S.redeeming = true; render();
  try{
    const uid = S.user.uid;
    const amount = await fb.runTransaction(db, async t=>{
      const cRef = fb.doc(db,"redeemCodes",code), cs = await t.get(cRef);
      if(!cs.exists()) throw new Error("Invalid redeem code");
      const c = cs.data();
      if(c.active !== true) throw new Error("This code is not active");
      if(c.target === "user" && c.userId !== uid) throw new Error("This code is not valid for your account");
      if(Number(c.maxUses||0) > 0 && Number(c.used||0) >= Number(c.maxUses)) throw new Error("This code has been fully redeemed");
      const rRef = fb.doc(db,"users",uid,"redeems",code), rs = await t.get(rRef);
      if(rs.exists()) throw new Error("You already redeemed this code");
      const uRef = fb.doc(db,"users",uid), us = await t.get(uRef);
      if(!us.exists()) throw new Error("Profile not found");
      const amt = Number(c.amount||0), nb = Math.round((Number(us.data().balance||0)+amt)*100)/100;
      t.set(rRef,{code,amount:c.amount,createdAt:fb.serverTimestamp()});
      t.update(uRef,{balance:nb,lastRedeem:code});
      t.update(cRef,{used:Number(c.used||0)+1});
      t.set(fb.doc(fb.collection(db,"users",uid,"ledger")),{kind:"redeem",direction:"credit",amount:c.amount,code,balanceAfter:nb,createdAt:fb.serverTimestamp()});
      return amt;
    });
    S.rcInput = ""; toast("Redeemed! +"+fmt(amount)+" BDT added to your balance");
  }catch(e){
    console.error(e);
    toast(e.code==="permission-denied" ? "This code cannot be redeemed" : (e.message||"Redeem failed"));
  }
  S.redeeming = false; render();
}

   (Admin panel > Settings > Language). A user's own choice is saved on their phone. */
const LANGS = [["en","English"],["bn","বাংলা"]];
const langName = k => (LANGS.find(l=>l[0]===k)||[])[1] || "English";
function curLang(){
  const en = (S.langCfg && Array.isArray(S.langCfg.enabled) && S.langCfg.enabled.length) ? S.langCfg.enabled : ["en","bn"];
  let u = null, cached = null;
  try{ u = localStorage.getItem("nova_lang"); cached = localStorage.getItem("nova_lang_def"); }catch{}
  const def = (S.langCfg && S.langCfg.default) || cached || "en";
  if(u && LANGS.some(l=>l[0]===u) && en.includes(u)) return u;
  return en.includes(def) ? def : en[0];
}

function trStr(s){
  const core = String(s).trim(); if(!core) return s;
  let r = BN[core];
  if(r === undefined) for(const [re,fn] of BNP){ const m = core.match(re); if(m){ r = fn(m); break; } }
  if(r === undefined) return s;
  const i = s.indexOf(core);
  return s.slice(0,i) + r + s.slice(i+core.length);
}
function trWalk(n){
  if(n.nodeType === 3){ const v = trStr(n.nodeValue); if(v !== n.nodeValue) n.nodeValue = v; return; }

  for(const a of ["placeholder","aria-label","title"]){ const x = n.getAttribute(a); if(x){ const v = trStr(x); if(v !== x) n.setAttribute(a,v); } }
  n.childNodes.forEach(trWalk);
}

async function doClaimBonus(){
  if(S.bonusBusy) return;
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": claim is disabled");
  if(S.profile.bonusClaimed === true) return toast("You already claimed your sign up bonus");
  const amt = Number(S.sbonus||0);
  if(!(amt > 0)) return toast("No sign up bonus is available right now");
  if(DEMO){ S.profile.balance = Math.round((Number(S.profile.balance||0)+amt)*100)/100; S.profile.bonusClaimed = true; toast("Claimed! +"+fmt(amt)+" BDT added to your balance"); render(); return; }
  S.bonusBusy = true; render();
  try{
    const uid = S.user.uid;
    const got = await fb.runTransaction(db, async t=>{
      const uRef = fb.doc(db,"users",uid), us = await t.get(uRef);
      const sRef = fb.doc(db,"settings","signupBonus"), ss = await t.get(sRef);
      const lRef = fb.doc(db,"users",uid,"ledger","signup_bonus"), ls = await t.get(lRef);
      if(!us.exists()) throw new Error("Profile not found");
      if(us.data().bonusClaimed === true || ls.exists()) throw new Error("You already claimed your sign up bonus");
      const a = Number(ss.exists() ? ss.data().amount : 0) || 0;
      if(!(a > 0)) throw new Error("No sign up bonus is available right now");
      const nb = Math.round((Number(us.data().balance||0)+a)*100)/100;
      t.update(uRef,{balance:nb,bonusClaimed:true});
      t.set(lRef,{kind:"signup_bonus",direction:"credit",amount:a,balanceAfter:nb,createdAt:fb.serverTimestamp()});
      return a;
    });
    toast("Claimed! +"+fmt(got)+" BDT added to your balance");
  }catch(e){
    console.error(e);
    toast(e.code==="permission-denied" ? "Could not claim the bonus" : (e.message||"Claim failed"));
  }
  S.bonusBusy = false; render();
}

const navSnap = () => ({ t:S.tab, v:S.view||null, d:S.detailId||null, s:S.detailSid||null, sh:S.sheet ? (S.sheet.id||1) : null });
function navApply(nv){ S.tab = nv.t; S.view = nv.v; S.detailId = nv.d; S.detailSid = nv.s; if (!nv.sh) S.sheet = null; render(true); }
/* ---- back support: phone back button / browser back / on-screen back ---- */
let navIdx = 0, navLast = null, navRestoring = false, navIgnore = 0;
function navSync(){
  if (navRestoring) return;
  try {
    const snap = navSnap(), key = JSON.stringify(snap);
    if (S.user) { try { sessionStorage.setItem("nova_nav", JSON.stringify({ u:S.user.uid, t:snap.t, v:snap.v, d:snap.d, s:snap.s })); } catch {} }
    if (navLast === null) { history.replaceState({ nv:snap, i:0 }, ""); navLast = key; navIdx = 0; return; }
    if (key !== navLast) { history.pushState({ nv:snap, i:++navIdx }, ""); navLast = key; }
  } catch {}
}
try {
  new MutationObserver(muts => muts.forEach(mu => {
    mu.addedNodes.forEach(n => { if (n.classList && n.classList.contains("modal")) { n._h = true; try { history.pushState({ m:1, i:navIdx }, ""); } catch {} } });
    mu.removedNodes.forEach(n => { if (n.classList && n.classList.contains("modal") && n._h && !n._pop) { navIgnore++; try { history.back(); } catch { navIgnore--; } } });
  })).observe(document.body, { childList:true });
} catch {}
window.addEventListener("popstate", e => {
  if (navIgnore > 0) { navIgnore--; return; }
  const top = [...document.querySelectorAll(".modal")].pop();
  if (top) { top._pop = true; top.remove(); return; }
  const st = e.state; if (!st || !st.nv) return;
  navRestoring = true; navIdx = st.i || 0;
  navApply(st.nv);
  navRestoring = false;
  navLast = JSON.stringify(navSnap());
});
function render(force){
  if(S.sheet && force!==true && !isOut()) return;
  const app = $("#app");
  if(!S.user){ app.innerHTML = authView(); return; }
  if(isOut()){ S.sheet = null; app.innerHTML = blockedView(); return; }
  app.innerHTML = noticeBar() + (S.view === "team" ? teamView() : S.view === "orders" ? ordersView() : S.view === "odetail" ? orderDetailView() : S.view === "sdetail" ? sellDetailView() : S.view === "redeem" ? redeemView() : S.view === "rewards" ? rewardsView() : S.view ? ledgerView() : ({home,buy,sell,mine})[S.tab]()) + nav() + (S.sheet ? sheetView() : "");
  navSync();
  sheetWatch();
}

  unsubs.forEach(u=>u()); unsubs=[
    onS(doc(db,"users",uid), s=>{
      if(s.exists() && s.data().accountStatus === "deleted"){      /* deleted by admin: sign out right away */
        S.profile = {}; S.authMode = "login"; S.err = "This account has been deleted. Contact support.";
        fb.signOut(auth); return;
      }
      { const nd = s.data()||{}, o = S.profile||{}, a = Object.keys(nd).filter(k=>k!=="lastSeenAt"), b = Object.keys(o).filter(k=>k!=="lastSeenAt");
        const same = s.exists() && a.length === b.length && a.every(k=>JSON.stringify(nd[k]) === JSON.stringify(o[k]));
        S.profile = nd; if(!same) render(); }
      if(s.exists() && s.data().code && !S.codeChecked){ S.codeChecked = true; ensureCode(uid, s.data().code); }
      if(!s.exists() && !s.metadata.fromCache && !S.creating && !S.registering){

        fb.setDoc(doc(db,"users",uid),{phone:(S.user?.email||"").replace(/@nerivo\.local$/,"").slice(0,20),email:S.user?.email||"",balance:0,code:rnd6(),saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()})
          .catch(e=>showErr("Profile create failed: "+e.code)).finally(()=>{ S.creating=false; });
      }
    }),
    onS(collection(db,"users",uid,"wallets"), s=>{ S.wallets = s.docs.map(d=>({id:d.id,...d.data()})); render(); }),
    onS(query(collection(db,"buyOrders"),where("status","in",["open","reserved","created"])), s=>{ S.orders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt)}; }); render(); }),
    onS(query(collection(db,"buyOrders"),where("claimedBy","==",uid)), s=>{ S.myOrders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt),submittedMs:ms(x.submittedAt),reviewedMs:ms(x.reviewedAt)}; }); render(); }),
    onS(query(collection(db,"sellOrders"),where("userId","==",uid)), s=>{ S.sellOrders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,createdMs:ms(x.createdAt)||(x.history&&x.history[0]&&x.history[0].at)||0}; }); render(); }),
    onS(collection(db,"users",uid,"redeems"), s=>{ S.redeems = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,ms:ms(x.createdAt)||Date.now()}; }); render(); }),
    onS(doc(db,"settings","support"), s=>{ S.sup = (s.exists() && Array.isArray(s.data().list)) ? s.data().list : []; render(); }),
    onS(doc(db,"settings","tutorials"), s=>{ S.tuts = (s.exists() && Array.isArray(s.data().list)) ? s.data().list : []; render(); }),
    onS(doc(db,"settings","rates"), s=>{ if(s.exists()) S.rates = s.data(); render(); }),
    onS(doc(db,"settings","language"), s=>{
      S.langCfg = s.exists() ? s.data() : null;
      try{ if(S.langCfg && S.langCfg.default) localStorage.setItem("nova_lang_def", S.langCfg.default); }catch{}
      const l = curLang(); if(S._lang !== l){ S._lang = l; document.documentElement.lang = l; render(); }
    }),
    onS(doc(db,"settings","signupBonus"), s=>{ S.sbonus = s.exists() ? (Number(s.data().amount)||0) : 0; render(); }),
    onS(query(collection(db,"users",uid,"ledger"),orderBy("createdAt","desc"),limit(100)), s=>{
      S.ledger = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,when:(x.createdAt?.toDate?.()||new Date()).toLocaleString()}; }); render(); }),

async function ensureCode(uid, code){
  try{
    const r = await fb.getDoc(fb.doc(db,"referralCodes",code));
    if(!r.exists()) await fb.setDoc(fb.doc(db,"referralCodes",code),{uid});
    else if(r.data().uid !== uid){ S.codeOk = false; S.codeErr = "code-taken"; render(); return; }
    S.codeOk = true;
  }catch(e){ S.codeOk = false; S.codeErr = e.code || e.message; }
  render();
}

async function register(email, pw, phone, refCode){
  S.registering = true;
  let uid = null;
  try{
    const c = await fb.createUserWithEmailAndPassword(auth, email, pw);
    uid = c.user.uid;
    let code = "";
    for(let i=0;i<6 && !code;i++){
      const x = rnd6();
      try{ const r = await fb.getDoc(fb.doc(db,"referralCodes",x)); if(!r.exists()) code = x; }catch{ code = x; }
    }
    let refUid = null, refUps = [], note = "";
    if(refCode) try{
      const r = await fb.getDoc(fb.doc(db,"referralCodes",refCode));
      if(!r.exists()) note = "Referral code not found. The referrer must log in once with the latest app, or ask admin to link you.";
      else if(r.data().uid === uid) note = "You cannot use your own code.";
      else { refUid = r.data().uid; refUps = Array.isArray(r.data().uplines) ? r.data().uplines : []; }
    }catch(e){ note = "Referral lookup failed ("+(e.code||e.message)+"). Publish the latest Firestore rules."; }
    const prof = {phone,email,balance:0,code,saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()};
    if(refUid) prof.referredBy = refUid;
    await fb.setDoc(fb.doc(db,"users",uid), prof);     /* step 1: profile (must work) */
    const chain = refUid ? [refUid, ...refUps.filter(x=>x && x!==uid && x!==refUid)].slice(0,10) : [];
    try{ await fb.setDoc(fb.doc(db,"referralCodes",code), {uid, uplines:chain}); }
    catch(e1){ try{ await fb.setDoc(fb.doc(db,"referralCodes",code), {uid}); }catch(e){ note += " [Step 2: referral code save failed: "+(e.code||e.message)+"]"; } }
    if(refUid) try{ await fb.setDoc(fb.doc(db,"users",refUid,"team",uid), {name:maskName(phone,email), joinedAt:fb.serverTimestamp(), level:0, tasks:0, amount:0, active:false}); }
    catch(e){ note += " [Step 3: team link failed: "+(e.code||e.message)+"]"; }
    for(let i=1;i<chain.length;i++){ try{ await fb.setDoc(fb.doc(db,"users",chain[i],"team",uid), {name:maskName(phone,email), joinedAt:fb.serverTimestamp(), level:i, tasks:0, amount:0, active:false}); }catch{} }
    if(note) showErr(note.trim());
    touchIp(uid);
  }catch(e){
    S.registering = false;
    if(uid){ showErr("Account created but step 1 (create profile) failed: "+(e.code||e.message)+". Check the Firestore rules."); autoProfile(uid); }
    throw e;
  }finally{ S.registering = false; }
}

async function verifyRef(){
  const code = S.authForm.ref.trim();
  if(!code){ S.refOk = false; S.refMsg = "Enter a code to verify, or leave it empty."; render(); return; }
  S.refChecking = true; render();
  if(DEMO){ S.refChecking = false; S.refOk = true; S.refMsg = "This referral code is valid."; render(); return; }
  try{
    const r = await fb.getDoc(fb.doc(db,"referralCodes",code));
    if(r.exists()){ S.refOk = true; S.refMsg = "This referral code is valid."; }
    else { S.refOk = false; S.refMsg = "This referral code is not valid."; }
  }catch(e){ S.refOk = false; S.refMsg = "Could not check the code right now ("+(e.code||"network")+"). Try again."; }
  S.refChecking = false; render();
}

async function doAuth(){
  const phone = S.authForm.phone.trim(), pw = S.authForm.pw, reg = S.authMode==="register";
  S.err = "";
  if(DEMO){ S.user={uid:"demo",email:phoneToEmail(phone||"01700000000")}; demoData(); render(); return; }
  if(!/^01\d{9}$/.test(phone)){ S.err = "Enter a valid 11-digit phone number (01XXXXXXXXX)."; render(); return; }
  if(pw.length < 6){ S.err = "Password must be at least 6 characters."; render(); return; }
  if(reg){
    const pw2 = S.authForm.pw2, refCode = S.authForm.ref.trim();
    if(pw !== pw2){ S.err = "Passwords do not match."; render(); return; }
    if(refCode && S.refOk !== true){ await verifyRef(); if(S.refOk !== true){ S.err = "This referral code is not valid. Fix it or clear the box to continue without one."; render(); return; } }
  }
  const email = phoneToEmail(phone);
  try{
    if(reg) await register(email, pw, phone, S.authForm.ref.trim());
    else { const c = await fb.signInWithEmailAndPassword(auth,email,pw); touchIp(c.user.uid); }
  }catch(e){ S.err = e.code==="auth/invalid-credential"?"Wrong phone number or password.":e.code==="auth/email-already-in-use"?"This phone number is already registered. Log in instead.":e.code==="auth/weak-password"?"Password must be at least 6 characters.":e.message; render(); }
}

/* Step 1: tap "Claim" -> sheet opens (nothing is written yet). Step 2: pick bKash/Nagad -> order is created + locked instantly. */
/* Today's referral commission: counts only entries created since 12:00 AM (device local time),
   and starts again from 0.00 at every midnight. */
/* Online status for admin: save lastSeenAt about every 30 seconds while the app is open and visible. */
function startPresence(uid){
  const beat = () => { if(document.hidden || navigator.onLine === false) return; fb.updateDoc(fb.doc(db,"users",uid),{lastSeenAt:fb.serverTimestamp()}).catch(()=>{}); };
  const vis = () => { if(!document.hidden) beat(); };
  const iv = setInterval(beat, 30000);
  document.addEventListener("visibilitychange", vis);
  beat();
  return () => { clearInterval(iv); document.removeEventListener("visibilitychange", vis); };
}
function listenTodayRef(uid){
  let un = null, timer = null, dead = false;
  const run = () => {
    if(dead) return;
    if(un){ un(); un = null; }
    const start = new Date(); start.setHours(0,0,0,0);
    const next = new Date(start); next.setDate(next.getDate()+1);
    S.refToday = 0; render();
    const {collection,query,where,orderBy,onSnapshot,Timestamp} = fb;
    un = onSnapshot(query(collection(db,"users",uid,"ledger"), where("createdAt",">=",Timestamp.fromDate(start)), orderBy("createdAt","desc")), snap=>{
      let t = 0;
      snap.docs.forEach(d=>{ const x = d.data(), a = Number(x.amount)||0;
        if(x.kind === "referral" || x.kind === "referral_bonus") t += a;
        else if(x.kind === "referral_reverse") t -= a; });
      S.refToday = Math.max(0, Math.round(t*100)/100); render();
    }, ()=>{});
    timer = setTimeout(run, next - Date.now() + 500);     /* midnight: reset to 0 */
  };
  run();
  return () => { dead = true; if(un) un(); clearTimeout(timer); };
}

function startClaim(id){
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": new orders are disabled");
  const o = findOrder(id); if(!o) return;
  if(isMine(o)) S.sheet = {id, snap:{...o}, created:true, method:o.payMethod||null, sender:o.senderNumber||"", trx:o.trxId||""};
  else if(S.user && o.sellerId===S.user.uid) return toast("This order is not available");
  else if(o.status==="open") S.sheet = {id, snap:{...o}, created:false, method:null, sender:"", trx:""};
  else return toast("This order is no longer available");
  render(true);
}

async function pickMethod(m){
  const sh = S.sheet; if(!sh || S.claiming) return;
  const o = findOrder(sh.id) || sh.snap; if(!o) return;
  const uid = S.user.uid;
  if(sh.created){            /* older claimed order that had no wallet yet: just save the wallet */
    sh.method = m; render(true);
    if(!DEMO) fb.updateDoc(fb.doc(db,"buyOrders",sh.id),{payMethod:m}).catch(e=>showErr("Save wallet failed: "+(e.code||e.message)));
    return;
  }
  /* instant: show payment details right now, lock the order on the server in the background */
  S.myOrders = [{...o,status:"created",claimedBy:uid,payMethod:m,claimedMs:Date.now()}, ...S.myOrders.filter(x=>x.id!==sh.id)];
  sh.method = m; sh.created = true; S.claiming = true; render(true);
  try{
    if(!DEMO) await fb.runTransaction(db, async t=>{
      const ref = fb.doc(db,"buyOrders",sh.id), snap = await t.get(ref);
      if(!snap.exists() || snap.data().status !== "open" || snap.data().sellerId === uid) throw new Error("taken");
      t.update(ref,{status:"created",claimedBy:uid,claimedAt:fb.serverTimestamp(),payMethod:m,history:hist("created","Claimed with "+payLabel(m))});
    });
  }catch(e){
    console.error(e);
    S.myOrders = S.myOrders.filter(x=>x.id!==sh.id); S.sheet = null;
    if(e.message==="taken") toast("Sorry, another user just took this order");
    else { toast("Could not create the order ("+(e.code||"error")+")"); showErr("Create order failed: "+(e.code||"")+" "+e.message); }
  }
  S.claiming = false; render(true);
}

async function submitPay(){
  const sh = S.sheet;
  const sender = ($("#ps")?.value||"").trim(), trx = ($("#pt")?.value||"").trim().toUpperCase();
  sh.sender = sender; sh.trx = trx;
  if(!/^01\d{9}$/.test(sender)) return toast("Enter your 11-digit number (01XXXXXXXXX)");
  if(!/^[A-Z0-9]{6,20}$/.test(trx)) return toast("Enter a valid Transaction ID (6-20 letters or numbers)");
  if(S.claiming) return;
  S.claiming = true;
  try{
    if(DEMO){ const x = S.myOrders.find(y=>y.id===sh.id); if(x) Object.assign(x,{status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx}); }
    else await fb.updateDoc(fb.doc(db,"buyOrders",sh.id),{status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx,submittedAt:fb.serverTimestamp(),history:hist("pending","Payment proof submitted ("+trx+")")});
    S.submitted[sh.id] = true;
    S.sheet = null; S.view = "orders"; S.hTop = "buy"; S.hTab = "pending"; toast("Submitted. Your order is Pending until admin checks it");
  }catch(e){
    console.error(e);
    toast("Could not submit payment ("+(e.code||"error")+")");
    showErr("Submit failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

S.relIds = {}; S.submitted = {}; S.relTry = {};
const leftTxt = o => { const l = Math.max(0, CLAIM_MS-(Date.now()-(o.claimedMs||Date.now()))); return p2(Math.floor(l/60000))+":"+p2(Math.floor(l%60000/1000)); };
/* leaving the pay sheet without submitting payment details releases the order */
function sheetWatch(){
  const cur = S.sheet ? S.sheet.id : null;
  if(S._shId && S._shId !== cur){
    const id = S._shId; S._shId = null;
    const o = S.myOrders.find(x=>x.id===id);
    if(o && isMine(o) && !o.trxId && !S.submitted[id] && !S.relIds[id]) cancelClaim(id, "Order released because you left without sending payment details");
  }
  if(cur) S._shId = cur;
}
/* any online user releases claimed orders whose time is over (rules check the real server time) */
async function releaseExpired(){
  if(DEMO || !S.user || isOut()) return;
  const now = Date.now();
  for(const o of S.orders){
    if(o.status !== "created" || o.trxId || !o.claimedMs) continue;
    if(now - o.claimedMs < CLAIM_MS + 3000) continue;
    if(S.relTry[o.id] && now - S.relTry[o.id] < 60000) continue;
    S.relTry[o.id] = now;
    try{ await fb.updateDoc(fb.doc(db,"buyOrders",o.id), {status:"open", claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null, history:fb.arrayUnion({status:"open", by:"system", at:Date.now(), note:"Auto released: time is over, payment details were not submitted"})}); }
    catch(e){ /* already released by someone else, or not yet expired on the server */ }
  }
}
let tickN = 0;
setInterval(()=>{
  const sh = S.sheet;
  if(sh && sh.created && S.user){
    const o = findOrder(sh.id) || sh.snap || {};
    if(OS(o)==="created" && !o.trxId && o.claimedMs){
      const el = $("#cdt"); if(el) el.textContent = leftTxt(o);
      if(Date.now()-o.claimedMs >= CLAIM_MS && !S.claiming) cancelClaim(sh.id, "Time is over. The order was released back to the pool.");
    }
  }
  if(++tickN % 20 === 0) releaseExpired();
}, 1000);

async function cancelClaim(id, msg){
  if(S.claiming) return;
  S.relIds[id] = Date.now();
  S.claiming = true;
  try{
    if(DEMO) S.myOrders = S.myOrders.filter(x=>x.id!==id);
    else await fb.updateDoc(fb.doc(db,"buyOrders",id), {status:"open", claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null, history:hist("open","Released by user")});
    S.sheet = null; if(S.view==="odetail") S.view = "orders"; toast(msg || "Order released back to the pool");
  }catch(e){
    console.error(e);
    toast("Could not cancel this order");
    showErr("Cancel failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

/* ---------- Events ---------- */
document.addEventListener("input", e=>{
  if(S.sheet){ if(e.target.id==="ps") S.sheet.sender=e.target.value; if(e.target.id==="pt") S.sheet.trx=e.target.value; }
  if(e.target.id==="aphone") S.authForm.phone=e.target.value;
  else if(e.target.id==="apw") S.authForm.pw=e.target.value;
  else if(e.target.id==="apw2") S.authForm.pw2=e.target.value;
  else if(e.target.id==="arc"){ S.authForm.ref=e.target.value; S.refOk=undefined; S.refMsg=""; }
});
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if("tab" in d){ S.tab=d.tab; S.view=null; render(); scrollTo(0,0); }
  else if("back" in d){ if(navIdx > 0) history.back(); else { S.view = (S.view==="odetail" || S.view==="sdetail") ? "orders" : null; render(); } }
  else if("cur" in d){ S.cur=d.cur; render(); }
  else if("range" in d){ S.range=+d.range; render(); }
  else if("htab" in d){ S.hTab=d.htab; render(); }
  else if("otop" in d){ S.hTop=d.otop; S.sWal=null; S.bWal=null; render(); }
  else if("wpay" in d){ S.bWal=d.wpay; S.sWal=null; S.view="orders"; S.hTop="buy"; S.hTab="all"; render(); scrollTo(0,0); }
  else if("wcol" in d){ S.bWal=null; S.sWal=d.wcol; S.view="orders"; S.hTop="sell"; S.sTab="all"; render(); scrollTo(0,0); }
  else if("wtoday" in d){ S.tdW = S.tdW===d.wtoday ? null : d.wtoday; render(); }
  else if("wclear" in d){ S.sWal=null; S.bWal=null; render(); }
  else if("odetail" in d){ S.detailId=d.odetail; S.view="odetail"; render(); scrollTo(0,0); }
  else if("orefresh" in d){ if(!DEMO && S.user) subscribe(S.user.uid); toast("Refreshed"); }
  else if("claim" in d) startClaim(d.claim);
  else if("cancel" in d){ if(confirm("Release this order back to the pool? Do this only if you have not sent any money.")) cancelClaim(d.cancel); }
  else if("verifyref" in d) verifyRef();
  else if("method" in d) pickMethod(d.method);
  else if("closesheet" in d){ if(navIdx > 0 && navLast && JSON.parse(navLast).sh){ history.back(); } else { S.sheet=null; render(true); } }
  else if("submitpay" in d) submitPay();
  else if("copynum" in d) copyOrShow(d.copynum, "Number copied");
  else if("copyid" in d) copyOrShow(d.copyid, d.cmsg==="mask" ? "Order mask copied" : "Order ID copied");
  else if("toggle" in d) toggleWallet(d.toggle);
  else if("sync" in d) toast("Balance refreshed");
  else if("add" in d) addWalletSheet();
  else if("copylink" in d) copyOrShow(refLink(), "Referral link copied");
  else if("sharelink" in d){ if(navigator.share){ try{ await navigator.share({title:"Join me on Nova Pay", url:refLink()}); }catch{} } else copyOrShow(refLink(), "Referral link copied"); }
  else if("copy" in d) copyOrShow(S.profile.code||"", "Code copied");
  else if("go" in d && d.go==="support") openSupport();
  else if("go" in d && d.go==="lang") openLang();
  else if("go" in d && d.go==="redeem"){ S.view="redeem"; render(); scrollTo(0,0); }
  else if("redeem" in d) doRedeem();
  else if("claimbonus" in d) doClaimBonus();
  else if("go" in d && d.go==="collections"){ S.sWal=null; S.bWal=null; S.view="orders"; S.hTop="sell"; S.sTab="all"; render(); scrollTo(0,0); }
  else if("tut" in d) playTut(Number(d.tut));
  else if("osdetail" in d){ S.detailSid=d.osdetail; S.view="sdetail"; render(); scrollTo(0,0); }
  else if("stab" in d){ S.sTab=d.stab; render(); }
  else if("tmlv" in d){ S.tmLv=d.tmlv; render(); }
  else if("tmtab" in d){ S.tmTab=d.tmtab; render(); }
  else if("tmlist" in d){ S.tmList=+d.tmlist; render(); }
  else if("go" in d){ const v = d.go==="purchases" ? "orders" : d.go; if(["balance","orders","team","rewards"].includes(v)){ S.view=v; if(v==="orders"){ S.hTab="all"; S.hTop="buy"; S.sWal=null; S.bWal=null; } render(); scrollTo(0,0); } else toast("Coming soon: "+d.go); }
  else if("mode" in d){ S.authMode=S.authMode==="login"?"register":"login"; S.err=""; S.refOk=undefined; S.refMsg=""; render(); }
  else if("auth" in d) doAuth();
  else if("logout" in d){ S.authForm={phone:"",pw:"",pw2:"",ref:""}; S.refOk=undefined; S.refMsg=""; if(DEMO){ S.user=null; render(); } else await fb.signOut(auth); }
});

/* reset "Today's income" at 12:00 AM without the user having to reload */
let lastDay = todayStr();
const dayCheck = () => { if(todayStr() !== lastDay && S.user && !S.sheet){ lastDay = todayStr(); render(); } };
setInterval(dayCheck, 15000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) dayCheck(); });
window.addEventListener("focus", dayCheck);
render();
if(!DEMO){
  setInterval(()=>{ if(!READY && !S.user) render(); },1000);
  setTimeout(()=>{ if(!READY) showErr("Still connecting after 30 seconds. Your network may be slow or blocking Google servers. Try another network or a VPN."); },30000);
  (async()=>{
    try{
      const V = "https://www.gstatic.com/firebasejs/10.12.2/";
      const done = [];
      const ld = (n,u) => import(V+u).then(m => { done.push(n); setStatus("Downloaded: "+done.join(", ")+" (of 3)"); return m; });
      setStatus("Downloading Firebase files...");
      const [a, f, ap] = await Promise.all([ld("auth","firebase-auth.js"), ld("database","firebase-firestore.js"), ld("app","firebase-app.js")]);
      fb = { ...a, ...f };
      const app = ap.initializeApp(firebaseConfig);
      auth = a.initializeAuth(app, { persistence: [a.indexedDBLocalPersistence, a.browserLocalPersistence, a.inMemoryPersistence] });
      db = f.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
      READY = true;
    }catch(e){ showErr("Firebase could not load: "+e.message+" (check internet or VPN)"); return; }
    fb.onAuthStateChanged(auth,u=>{
      if(u && !/@nerivo\.local$/i.test(u.email||"")){ fb.signOut(auth); return; }   /* not a user-panel account (e.g. an old admin session): sign out */
      S.user=u; unsubs.forEach(x=>x()); unsubs=[]; S.view=null; S.codeChecked=false;
      /* page refresh: stay on the same page (Home / Buy / Sell / Mine or inner page) instead of jumping to Home */
      if(!window.__navBoot){ window.__navBoot = true;
        if(u){ try{ const sv = JSON.parse(sessionStorage.getItem("nova_nav")||"null");
          if(sv && sv.u===u.uid && ["home","buy","sell","mine"].includes(sv.t)){ S.tab=sv.t; S.view=sv.v||null; S.detailId=sv.d||null; S.detailSid=sv.s||null; } }catch{} }
      } else if(!u){ try{ sessionStorage.removeItem("nova_nav"); }catch{} S.tab="home"; }
      S.codeChecked=false; S.codeOk=undefined; S.team=[]; S.myOrders=[]; S.sellOrders=[]; S.redeems=[]; S.rcInput=""; S.sheet=null;
      render();
      if(u) subscribe(u.uid);
    });
  })();
}
</script>
