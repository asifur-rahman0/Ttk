const accStatus = () => S.profile.accountStatus || (S.profile.disabled ? "banned" : "active");
const isOut = () => ["banned","suspended","deleted"].includes(accStatus());
const restricted = () => ["locked","frozen"].includes(accStatus());
const ACC_MSG = {
  deleted:["Account deleted","This account has been deleted. Contact support if you need help."],
  banned:["Account banned","Your account has been banned. Contact support if you think this is a mistake."],
  suspended:["Account suspended","Your account is suspended for now. Contact support for details."],
  frozen:["Balance frozen","Your balance is frozen. You can view your data but cannot take new orders."],
  locked:["Account locked","Your account is locked. You can view your data but cannot take new orders."]
};
const noticeBar = () => { if(!restricted()) return ""; const [t,m] = ACC_MSG[accStatus()]; return `<div class="notice"><b>${t}.</b> ${m}${S.profile.accountNote ? "<br>Note: "+esc(S.profile.accountNote) : ""}</div>`; };
function blockedView(){
  const [t,m] = ACC_MSG[accStatus()] || ACC_MSG.banned;
  return `<div class="auth"><h1>Nerivo</h1><div class="card" style="margin-top:20px;background:#fdecea;border-color:#f3c0b8"><div style="font-size:16px;font-weight:700;color:#c0392b">${t}</div><p class="sub" style="margin-top:8px;font-size:12px">${m}</p>${S.profile.accountNote ? `<p style="margin-top:10px;font-size:12px"><b>Note:</b> ${esc(S.profile.accountNote)}</p>` : ""}</div><button class="btn out" style="margin-top:20px" data-logout>Log out</button></div>`;
}

  return head("Buy") + `
  <div class="hero"><div class="flex"><div class="sp"><h2>Buy Platform Balance</h2><div class="sub" style="font-size:13px">Choose amount and wallet.</div></div><button class="flex" style="color:var(--g)" data-go="purchases">${IC.wallet} Purchase records</button></div>

const CHIPS = [["all","All"],["created","Created"],["pending","Pending"],["success","Success"],["failed","Failed"],["lock","Locked"]];
const p2 = n => String(n).padStart(2,"0");
const fmtT = t => { if(!t) return ""; const d = new Date(t); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds()); };
const pill = st => { const [t,c,bg] = ST[st] || [st,"#555","#eee"]; return `<span class="opill" style="color:${c};background:${bg}">${esc(t)}</span>`; };
const wlogo = m => m==="bkash" ? `<span class="wlogo bk">bKash</span>` : m==="nagad" ? `<span class="wlogo ng">নগদ</span>` : `<span class="wlogo" style="background:#8aa4bb">BDT</span>`;
const CHEV = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>`;
const REFRESH = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14 4M20 20v-4h-4"/></svg>`;

function ordersView(){
  const tabs = [["buy","BDT Buy"],["sell","BDT Sell"],["usdt","USDT"]].map(([k,l])=>`<button class="${S.hTop===k?"act":""}" data-otop="${k}">${l}</button>`).join("");
  let body = `<div class="empty">No Data</div>`;
  if(S.hTop === "buy"){
    const chips = CHIPS.map(([k,l])=>`<button class="${S.hTab===k?"act":""}" data-htab="${k}">${l}</button>`).join("");
    const all = [...S.myOrders].sort((a,b)=>(b.claimedMs||0)-(a.claimedMs||0));
    const rows = S.hTab === "all" ? all : all.filter(o=>OS(o)===S.hTab);
    const card = o => `<button class="ocard" data-odetail="${o.id}"><span class="oc1">${wlogo(o.payMethod)}<span class="sp"><span class="oamt">${esc(o.amount)}</span><span class="ow">${esc(o.payMethod||"")}</span></span>${pill(OS(o))}</span><span class="oc2"><span>${esc(fmtT(o.claimedMs))}</span><b>Details ›</b></span></button>`;
    body = `<div class="ochips">${chips}</div>` + (rows.length ? rows.map(card).join("") : `<div class="empty">No Data</div>`);
  }
  if(S.hTop === "sell"){
    const SC = [["all","All"],["processing","Processing"],["success","Success"],["failed","Failed"],["lock","Locked"]];
    const chips = SC.map(([k,l])=>`<button class="${S.sTab===k?"act":""}" data-stab="${k}">${l}</button>`).join("");
    const all = [...S.sellOrders].sort((a,b)=>(b.createdMs||0)-(a.createdMs||0));
    const rows = S.sTab === "all" ? all : all.filter(o=>o.status===S.sTab);
    const card = o => `<button class="ocard" data-osdetail="${o.id}"><span class="oc1">${wlogo(o.method)}<span class="sp"><span class="oamt">${esc(o.amount)}</span><span class="ow">${esc(o.number||"")}</span></span>${pill(o.status)}</span><span class="oc2"><span>${esc(fmtT(o.createdMs))}</span><b>Details ›</b></span></button>`;
    body = `<div class="ochips">${chips}</div>` + (rows.length ? rows.map(card).join("") : `<div class="empty">No Data</div>`);
  }
  return `<div class="ohead"><button data-back aria-label="Back">${CHEV}</button><h1>Order History</h1><button data-orefresh aria-label="Refresh">${REFRESH}</button></div><div class="otabs">${tabs}</div>${body}`;
}

function orderDetailView(){
  const head = `<div class="ohead"><button data-back aria-label="Back">${CHEV}</button><h1>Order Details</h1><span></span></div>`;
  const o = findOrder(S.detailId);
  if(!o) return head + `<div class="empty">Order not found</div>`;
  const st = OS(o), reward = Math.round((o.amount||0)*(o.rate||0))/100;
  const sentTo = o.payMethod==="bkash" ? o.bkashNumber : o.payMethod==="nagad" ? o.nagadNumber : "";
  const rows = [["Order ID",String(o.id).slice(0,8).toUpperCase()],["Type","BDT Buy"],["Wallet",payLabel(o.payMethod)],["Amount",fmt(o.amount)+" BDT"],["Reward ("+(o.rate||0)+"%)",fmt(reward)+" BDT"],["Sent to",sentTo],["Sent from",o.senderNumber],["Transaction ID",o.trxId],["Created",fmtT(o.claimedMs)],["Submitted",fmtT(o.submittedMs)]].filter(r=>r[1]);
  const lbl = x => x==="open" ? "Released" : ((ST[NS(x)]||[])[0] || x);
  let ev = (o.history||[]).map(h=>({at:h.at||0,t:(h.by==="admin"?"Admin":"You")+" · "+lbl(h.status),n:h.by==="admin"?"":(h.note||"")}));
  if(!ev.length){
    if(o.claimedMs) ev.push({at:o.claimedMs,t:"You · Created"});
    if(o.submittedMs) ev.push({at:o.submittedMs,t:"You · Pending",n:"Payment submitted"});
    if(o.reviewedMs) ev.push({at:o.reviewedMs,t:"Admin · "+lbl(st)});
  }
  ev.sort((a,b)=>a.at-b.at);
  const note = st==="pending" ? "Waiting for admin to check your payment." : st==="lock" ? "This order is locked by admin." : st==="created" ? "Send the money and submit the Transaction ID to continue." : "";
  return `${head}
  <div class="card" style="text-align:center"><div class="oamt" style="font-size:27px">${esc(o.amount)} <span style="font-size:13px;color:var(--mute)">BDT</span></div><div style="margin-top:10px">${pill(st)}</div>${note ? `<div class="sub" style="margin-top:10px">${note}</div>` : ""}</div>
  <div class="card">${rows.map(r=>`<div class="drow"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}</div>
  ${ev.length ? `<div class="card"><b>Timeline</b>${ev.map(e=>`<div class="drow" style="display:block"><div style="font-weight:600">${esc(e.t)}</div>${e.n ? `<div class="sub">${esc(e.n)}</div>` : ""}<div class="sub" style="font-size:11px">${esc(fmtT(e.at))}</div></div>`).join("")}</div>` : ""}
  ${st==="created" ? `<div class="flex" style="margin-top:16px;gap:10px"><button class="btn" data-claim="${o.id}">Continue payment</button><button class="btn out" data-cancel="${o.id}">Cancel</button></div>` : ""}`;
}

function sellDetailView(){
  const head = `<div class="ohead"><button data-back aria-label="Back">${CHEV}</button><h1>Sell Details</h1><span></span></div>`;
  const o = S.sellOrders.find(x=>x.id===S.detailSid);
  if(!o) return head + `<div class="empty">Order not found</div>`;
  const st = o.status;
  const rows = [["Order ID",String(o.id).slice(0,8).toUpperCase()],["Type","BDT Sell"],["Wallet",payLabel(o.method)],["Amount",fmt(o.amount)+" BDT"],["Receive number",o.number],["Created",fmtT(o.createdMs)],["Updated",fmtT(ms(o.reviewedAt))]].filter(r=>r[1]);
  const ev = (o.history||[]).map(h=>({at:h.at||0,t:(h.by==="admin"?"Admin":"You")+" · "+((ST[h.status]||[])[0]||h.status),n:h.by==="admin" ? (h.status==="failed" ? "Amount refunded to your balance" : "") : (h.note||"")})).sort((a,b)=>a.at-b.at);
  const note = st==="processing" ? "Your balance was deducted. Admin is processing your withdrawal." : st==="success" ? "The money was sent to your wallet." : st==="failed" ? "Withdrawal failed. The amount was refunded to your balance." : st==="lock" ? "This request is locked by admin. Contact support." : "";
  return `${head}
  <div class="card" style="text-align:center"><div class="oamt" style="font-size:27px">${esc(o.amount)} <span style="font-size:13px;color:var(--mute)">BDT</span></div><div style="margin-top:10px">${pill(st)}</div>${note ? `<div class="sub" style="margin-top:10px">${note}</div>` : ""}</div>
  <div class="card">${rows.map(r=>`<div class="drow"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}</div>
  ${ev.length ? `<div class="card"><b>Timeline</b>${ev.map(e=>`<div class="drow" style="display:block"><div style="font-weight:600">${esc(e.t)}</div>${e.n ? `<div class="sub">${esc(e.n)}</div>` : ""}<div class="sub" style="font-size:11px">${esc(fmtT(e.at))}</div></div>`).join("")}</div>` : ""}`;
}

function sheetView(){
  const sh = S.sheet, o = findOrder(sh.id) || sh.snap || {};
  const st = OS(o), made = !!sh.created, m = sh.method, ml = payLabel(m);
  const num = m==="bkash" ? o.bkashNumber : m==="nagad" ? o.nagadNumber : "";
  const closed = made && ["pending","success","failed","lock"].includes(st);
  const mb = (k,l) => { const n = k==="bkash" ? o.bkashNumber : o.nagadNumber; return `<button class="btn out" style="flex:1" data-method="${k}" ${n?"":"disabled"}>${l}</button>`; };
  let body;
  if(!m) body = `<p class="sub" style="margin-top:6px">Choose bKash or Nagad. The order is created instantly and locked for you, so no other user can claim it.</p>
    <div class="flex" style="margin-top:14px">${mb("bkash","bKash")}${mb("nagad","Nagad")}</div>`;
  else if(closed) body = `<p class="sub" style="margin-top:10px">This order is now: <b style="color:${ST[st][1]}">${ST[st][0]}</b>.</p>`;
  else body = `<div class="tile" style="margin-top:12px;background:var(--mint);color:var(--g)">✅ Order created with ${ml}. It is locked for you only.</div>
    <div class="tile" style="margin-top:12px"><div class="sub">Send exactly ${fmt(o.amount)} BDT to this ${ml} number</div>
      <div class="flex"><b class="sp" style="font-size:19px;letter-spacing:1px">${esc(num)}</b><button class="btn sm out" data-copynum="${esc(num)}">Copy</button></div></div>
    <input id="ps" type="tel" inputmode="numeric" placeholder="Your ${ml} number (sent from)" value="${esc(sh.sender)}">
    <input id="pt" placeholder="Transaction ID" autocapitalize="characters" value="${esc(sh.trx)}">
    <button class="btn" style="margin-top:14px" data-submitpay>Submit payment</button>
    <p class="sub" style="margin-top:8px;font-size:11px">Admin will update your order status (Success / Failed / Lock) after checking.</p>
    ${o.trxId ? "" : `<button class="btn sm out" style="margin-top:12px;width:100%" data-cancel="${sh.id}">Cancel and release this order</button>`}`;
  return `<div class="modal"><div class="sheet">
    <div class="flex"><h2 class="sp" style="font-size:16px">${made ? "Pay" : "Take order"} ${fmt(o.amount)} BDT</h2><button data-closesheet style="font-size:22px;padding:0 8px" aria-label="Close">×</button></div>
    ${body}
  </div></div>`;
}

function authView(){
  if(!DEMO && !READY) return `<div class="auth"><h1>Nerivo</h1><p class="sub" style="margin-top:14px;font-size:13px">Connecting to server... ${Math.round((Date.now()-T0)/1000)}s</p><p class="sub" style="margin-top:8px">${esc(S.status||"Starting...")}</p><p class="sub" style="margin-top:8px">A slow network can take up to a minute. If it stays stuck, reload.</p><button class="btn" style="margin-top:20px" onclick="location.reload()">Reload</button></div>`;
  const reg = S.authMode==="register", f = S.authForm;
  const refLine = !reg ? "" : S.refChecking ? `<p class="sub" style="margin-top:8px">Checking referral code...</p>`
    : S.refOk===true ? `<p style="margin-top:8px;color:var(--g);font-size:11px">✅ ${esc(S.refMsg||"This referral code is valid.")}</p>`
    : S.refOk===false ? `<p class="err" style="margin-top:8px">❌ ${esc(S.refMsg||"This referral code is not valid.")}</p>`
    : "";
  return `<div class="auth"><h1>Nerivo</h1><p class="sub" style="margin-top:6px">${reg?"Create your account":"Log in to continue"}</p>
  ${DEMO?`<p class="sub" style="margin-top:12px;color:var(--g)">Demo mode: Firebase is not set up yet. Tap the button to preview.</p>`:""}
  <input id="aphone" type="tel" inputmode="numeric" placeholder="Phone number (01XXXXXXXXX)" value="${esc(f.phone)}" autocomplete="tel">
  <input id="apw" type="password" placeholder="Password (6+ characters)" value="${esc(f.pw)}" autocomplete="${reg?"new-password":"current-password"}">
  ${reg?`<input id="apw2" type="password" placeholder="Confirm password" value="${esc(f.pw2)}" autocomplete="new-password">
  <div class="flex" style="margin-top:10px;gap:8px"><input id="arc" placeholder="Referral code (optional)" style="margin-top:0;flex:1" value="${esc(f.ref)}"><button class="btn sm" style="margin-top:0" data-verifyref>Verify</button></div>
  ${refLine}`:""}
  <div class="err">${esc(S.err)}</div>
  <button class="btn" style="margin-top:16px" data-auth>${reg?"Create account":"Log in"}</button>
  <p class="sub" style="text-align:center;margin-top:18px">${reg?"Have an account?":"New here?"} <a class="lnk" data-mode>${reg?"Log in":"Create account"}</a></p></div>`;
}

function nav(){
  const b=(k,l)=>`<button class="${S.tab===k?"act":""}" data-tab="${k}">${IC[k]}<span>${l}</span></button>`;
  return `<nav>${b("home","Home")}${b("buy","Buy")}<button class="gift" data-tab="home" aria-label="Rewards">🎁</button>${b("sell","Sell")}${b("mine","Mine")}</nav>`;
}

function render(force){
  if(S.sheet && force!==true && !isOut()) return;
  const app = $("#app");
  if(!S.user){ app.innerHTML = authView(); return; }
  if(isOut()){ S.sheet = null; app.innerHTML = blockedView(); return; }
  app.innerHTML = noticeBar() + (S.view === "team" ? teamView() : S.view === "orders" ? ordersView() : S.view === "odetail" ? orderDetailView() : S.view === "sdetail" ? sellDetailView() : S.view ? ledgerView() : ({home,buy,sell,mine})[S.tab]()) + nav() + (S.sheet ? sheetView() : "");
}

/* ---------- Data (Firestore) ---------- */
function subscribe(uid){
  const {doc,collection,query,where,orderBy,limit,onSnapshot} = fb;
  const onS = (r,cb) => onSnapshot(r,cb,e=>showErr(e.code+": "+e.message));
  unsubs.forEach(u=>u()); unsubs=[
    onS(doc(db,"users",uid), s=>{
      if(s.exists() && s.data().accountStatus === "deleted"){      /* deleted by admin: sign out right away */
        S.profile = {}; S.authMode = "login"; S.err = "This account has been deleted. Contact support.";
        fb.signOut(auth); return;
      }
      S.profile = s.data()||{}; render();
      if(s.exists() && s.data().code && !S.codeChecked){ S.codeChecked = true; ensureCode(uid, s.data().code); }
      if(!s.exists() && !s.metadata.fromCache && !S.creating && !S.registering){
        S.creating = true;
        fb.setDoc(doc(db,"users",uid),{phone:(S.user?.email||"").replace(/@nerivo\.local$/,"").slice(0,20),email:S.user?.email||"",balance:0,code:rnd6(),saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()})
          .catch(e=>showErr("Profile create failed: "+e.code)).finally(()=>{ S.creating=false; });
      }
    }),
    onS(collection(db,"users",uid,"wallets"), s=>{ S.wallets = s.docs.map(d=>({id:d.id,...d.data()})); render(); }),
    onS(query(collection(db,"buyOrders"),where("status","in",["open","reserved"])), s=>{ S.orders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt)}; }); render(); }),
    onS(query(collection(db,"buyOrders"),where("claimedBy","==",uid)), s=>{ S.myOrders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt),submittedMs:ms(x.submittedAt),reviewedMs:ms(x.reviewedAt)}; }); render(); }),
    onS(query(collection(db,"sellOrders"),where("userId","==",uid)), s=>{ S.sellOrders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,createdMs:ms(x.createdAt)||(x.history&&x.history[0]&&x.history[0].at)||0}; }); render(); }),
    onS(doc(db,"settings","rates"), s=>{ if(s.exists()) S.rates = s.data(); render(); }),
    onS(query(collection(db,"users",uid,"ledger"),orderBy("createdAt","desc"),limit(100)), s=>{
      S.ledger = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,when:(x.createdAt?.toDate?.()||new Date()).toLocaleString()}; }); render(); }),
    onS(query(collection(db,"users",uid,"team"),orderBy("joinedAt","desc"),limit(200)), s=>{
      S.team = s.docs.map(d=>{ const x=d.data(); return {id:d.id,name:x.name,when:(x.joinedAt?.toDate?.()||new Date()).toLocaleDateString()}; }); render(); })
  ];
}

async function ensureCode(uid, code){
  try{
    const r = await fb.getDoc(fb.doc(db,"referralCodes",code));
    if(!r.exists()) await fb.setDoc(fb.doc(db,"referralCodes",code),{uid});
    else if(r.data().uid !== uid){ S.codeOk = false; S.codeErr = "code-taken"; render(); return; }
    S.codeOk = true;
  }catch(e){ S.codeOk = false; S.codeErr = e.code || e.message; }
  render();
}

function autoProfile(uid){
  if(S.creating) return;
  S.creating = true;
  fb.setDoc(fb.doc(db,"users",uid),{phone:(S.user?.email||"").replace(/@nerivo\.local$/,"").slice(0,20),email:S.user?.email||"",balance:0,code:rnd6(),saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()})
    .catch(e=>showErr("Profile create failed: "+e.code)).finally(()=>{ S.creating=false; });
}

async function register(email, pw, phone, refCode){
  S.registering = true;
  let uid = null;
  try{
    const c = await fb.createUserWithEmailAndPassword(auth, email, pw);
    uid = c.user.uid;
    let code = "";
    for(let i=0;i<6 && !code;i++){
      const x = rnd6();
      try{ const r = await fb.getDoc(fb.doc(db,"referralCodes",x)); if(!r.exists()) code = x; }catch{ code = x; }
    }
    let refUid = null, note = "";
    if(refCode) try{
      const r = await fb.getDoc(fb.doc(db,"referralCodes",refCode));
      if(!r.exists()) note = "Referral code not found. The referrer must log in once with the latest app, or ask admin to link you.";
      else if(r.data().uid === uid) note = "You cannot use your own code.";
      else refUid = r.data().uid;
    }catch(e){ note = "Referral lookup failed ("+(e.code||e.message)+"). Publish the latest Firestore rules."; }
    const prof = {phone,email,balance:0,code,saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()};
    if(refUid) prof.referredBy = refUid;
    await fb.setDoc(fb.doc(db,"users",uid), prof);     /* step 1: profile (must work) */
    try{ await fb.setDoc(fb.doc(db,"referralCodes",code), {uid}); }
    catch(e){ note += " [Step 2: referral code save failed: "+(e.code||e.message)+"]"; }
    if(refUid) try{ await fb.setDoc(fb.doc(db,"users",refUid,"team",uid), {name:maskName(phone,email), joinedAt:fb.serverTimestamp()}); }
    catch(e){ note += " [Step 3: team link failed: "+(e.code||e.message)+"]"; }
    if(note) showErr(note.trim());
    touchIp(uid);
  }catch(e){
    S.registering = false;
    if(uid){ showErr("Account created but step 1 (create profile) failed: "+(e.code||e.message)+". Check the Firestore rules."); autoProfile(uid); }
    throw e;
  }finally{ S.registering = false; }
}

async function verifyRef(){
  const code = S.authForm.ref.trim();
  if(!code){ S.refOk = false; S.refMsg = "Enter a code to verify, or leave it empty."; render(); return; }
  S.refChecking = true; render();
  if(DEMO){ S.refChecking = false; S.refOk = true; S.refMsg = "This referral code is valid."; render(); return; }
  try{
    const r = await fb.getDoc(fb.doc(db,"referralCodes",code));
    if(r.exists()){ S.refOk = true; S.refMsg = "This referral code is valid."; }
    else { S.refOk = false; S.refMsg = "This referral code is not valid."; }
  }catch(e){ S.refOk = false; S.refMsg = "Could not check the code right now ("+(e.code||"network")+"). Try again."; }
  S.refChecking = false; render();
}

async function doAuth(){
  const phone = S.authForm.phone.trim(), pw = S.authForm.pw, reg = S.authMode==="register";
  S.err = "";
  if(DEMO){ S.user={uid:"demo",email:phoneToEmail(phone||"01700000000")}; demoData(); render(); return; }
  if(!/^01\d{9}$/.test(phone)){ S.err = "Enter a valid 11-digit phone number (01XXXXXXXXX)."; render(); return; }
  if(pw.length < 6){ S.err = "Password must be at least 6 characters."; render(); return; }
  if(reg){
    const pw2 = S.authForm.pw2, refCode = S.authForm.ref.trim();
    if(pw !== pw2){ S.err = "Passwords do not match."; render(); return; }
    if(refCode && S.refOk !== true){ await verifyRef(); if(S.refOk !== true){ S.err = "This referral code is not valid. Fix it or clear the box to continue without one."; render(); return; } }
  }
  const email = phoneToEmail(phone);
  try{
    if(reg) await register(email, pw, phone, S.authForm.ref.trim());
    else { const c = await fb.signInWithEmailAndPassword(auth,email,pw); touchIp(c.user.uid); }
  }catch(e){ S.err = e.code==="auth/invalid-credential"?"Wrong phone number or password.":e.code==="auth/email-already-in-use"?"This phone number is already registered. Log in instead.":e.code==="auth/weak-password"?"Password must be at least 6 characters.":e.message; render(); }
}

function addWalletSheet(){
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": this action is disabled");
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet"><h2>Add Wallet</h2><select id="wt"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select><input id="wn" type="tel" placeholder="Wallet number (01XXXXXXXXX)"><div class="err" id="we"></div><button class="btn" style="margin-top:16px" id="ws">Save wallet</button><button class="btn out" style="margin-top:10px" id="wc">Cancel</button></div>`;
  document.body.append(m);
  $("#wc").onclick=()=>m.remove();
  $("#ws").onclick=async()=>{
    const type=$("#wt").value, number=$("#wn").value.trim();
    if(!/^01\d{9}$/.test(number)){ $("#we").textContent="Enter an 11-digit number starting with 01."; return; }
    const w={type,number,balance:0,online:false};
    if(DEMO) S.wallets.push({id:String(Date.now()),...w});
    else await fb.addDoc(fb.collection(db,"users",S.user.uid,"wallets"),w);
    m.remove(); render(); toast("Wallet added");
  };
}

async function toggleWallet(id){
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": this action is disabled");
  const w=S.wallets.find(x=>x.id===id); w.online=!w.online;
  if(!DEMO) await fb.updateDoc(fb.doc(db,"users",S.user.uid,"wallets",id),{online:w.online});
  render(); toast(w.online?"Collection started":"Wallet offline");
}

/* Step 1: tap "Claim" -> sheet opens (nothing is written yet). Step 2: pick bKash/Nagad -> order is created + locked instantly. */
function startClaim(id){
  if(restricted()) return toast(ACC_MSG[accStatus()][0]+": new orders are disabled");
  const o = findOrder(id); if(!o) return;
  if(isMine(o)) S.sheet = {id, snap:{...o}, created:true, method:o.payMethod||null, sender:o.senderNumber||"", trx:o.trxId||""};
  else if(S.user && o.sellerId===S.user.uid) return toast("This order is not available");
  else if(o.status==="open") S.sheet = {id, snap:{...o}, created:false, method:null, sender:"", trx:""};
  else return toast("This order is no longer available");
  render(true);
}

async function pickMethod(m){
  const sh = S.sheet; if(!sh || S.claiming) return;
  const o = findOrder(sh.id) || sh.snap; if(!o) return;
  const uid = S.user.uid;
  if(sh.created){            /* older claimed order that had no wallet yet: just save the wallet */
    sh.method = m; render(true);
    if(!DEMO) fb.updateDoc(fb.doc(db,"buyOrders",sh.id),{payMethod:m}).catch(e=>showErr("Save wallet failed: "+(e.code||e.message)));
    return;
  }
  /* instant: show payment details right now, lock the order on the server in the background */
  S.myOrders = [{...o,status:"created",claimedBy:uid,payMethod:m,claimedMs:Date.now()}, ...S.myOrders.filter(x=>x.id!==sh.id)];
  sh.method = m; sh.created = true; S.claiming = true; render(true);
  try{
    if(!DEMO) await fb.runTransaction(db, async t=>{
      const ref = fb.doc(db,"buyOrders",sh.id), snap = await t.get(ref);
      if(!snap.exists() || snap.data().status !== "open" || snap.data().sellerId === uid) throw new Error("taken");
      t.update(ref,{status:"created",claimedBy:uid,claimedAt:fb.serverTimestamp(),payMethod:m,history:hist("created","Claimed with "+payLabel(m))});
    });
  }catch(e){
    console.error(e);
    S.myOrders = S.myOrders.filter(x=>x.id!==sh.id); S.sheet = null;
    if(e.message==="taken") toast("Sorry, another user just took this order");
    else { toast("Could not create the order ("+(e.code||"error")+")"); showErr("Create order failed: "+(e.code||"")+" "+e.message); }
  }
  S.claiming = false; render(true);
}

async function submitPay(){
  const sh = S.sheet;
  const sender = ($("#ps")?.value||"").trim(), trx = ($("#pt")?.value||"").trim().toUpperCase();
  sh.sender = sender; sh.trx = trx;
  if(!/^01\d{9}$/.test(sender)) return toast("Enter your 11-digit number (01XXXXXXXXX)");
  if(!/^[A-Z0-9]{6,20}$/.test(trx)) return toast("Enter a valid Transaction ID (6-20 letters or numbers)");
  if(S.claiming) return;
  S.claiming = true;
  try{
    if(DEMO){ const x = S.myOrders.find(y=>y.id===sh.id); if(x) Object.assign(x,{status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx}); }
    else await fb.updateDoc(fb.doc(db,"buyOrders",sh.id),{status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx,submittedAt:fb.serverTimestamp(),history:hist("pending","Payment proof submitted ("+trx+")")});
    S.sheet = null; S.view = "orders"; S.hTop = "buy"; S.hTab = "pending"; toast("Submitted. Your order is Pending until admin checks it");
  }catch(e){
    console.error(e);
    toast("Could not submit payment ("+(e.code||"error")+")");
    showErr("Submit failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

async function cancelClaim(id){
  if(S.claiming) return;
  S.claiming = true;
  try{
    if(DEMO) S.myOrders = S.myOrders.filter(x=>x.id!==id);
    else await fb.updateDoc(fb.doc(db,"buyOrders",id), {status:"open", claimedBy:null, claimedAt:null, payMethod:null, senderNumber:null, trxId:null, history:hist("open","Released by user")});
    S.sheet = null; if(S.view==="odetail") S.view = "orders"; toast("Order released back to the pool");
  }catch(e){
    console.error(e);
    toast("Could not cancel this order");
    showErr("Cancel failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

/* ---------- Events ---------- */
document.addEventListener("input", e=>{
  if(S.sheet){ if(e.target.id==="ps") S.sheet.sender=e.target.value; if(e.target.id==="pt") S.sheet.trx=e.target.value; }
  if(e.target.id==="aphone") S.authForm.phone=e.target.value;
  else if(e.target.id==="apw") S.authForm.pw=e.target.value;
  else if(e.target.id==="apw2") S.authForm.pw2=e.target.value;
  else if(e.target.id==="arc"){ S.authForm.ref=e.target.value; S.refOk=undefined; S.refMsg=""; }
});
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if("tab" in d){ S.tab=d.tab; S.view=null; render(); scrollTo(0,0); }
  else if("back" in d){ S.view = (S.view==="odetail" || S.view==="sdetail") ? "orders" : null; render(); }
  else if("cur" in d){ S.cur=d.cur; render(); }
  else if("range" in d){ S.range=+d.range; render(); }
  else if("htab" in d){ S.hTab=d.htab; render(); }
  else if("otop" in d){ S.hTop=d.otop; render(); }
  else if("odetail" in d){ S.detailId=d.odetail; S.view="odetail"; render(); scrollTo(0,0); }
  else if("orefresh" in d){ if(!DEMO && S.user) subscribe(S.user.uid); toast("Refreshed"); }
  else if("claim" in d) startClaim(d.claim);
  else if("cancel" in d){ if(confirm("Release this order back to the pool? Do this only if you have not sent any money.")) cancelClaim(d.cancel); }
  else if("verifyref" in d) verifyRef();
  else if("method" in d) pickMethod(d.method);
  else if("closesheet" in d){ S.sheet=null; render(true); }
  else if("submitpay" in d) submitPay();
  else if("copynum" in d){ try{ await navigator.clipboard.writeText(d.copynum); toast("Number copied"); }catch{ toast(d.copynum); } }
  else if("toggle" in d) toggleWallet(d.toggle);
  else if("sync" in d) toast("Balance refreshed");
  else if("add" in d) addWalletSheet();
  else if("copylink" in d){ try{ await navigator.clipboard.writeText(refLink()); toast("Referral link copied"); }catch{ toast(refLink()); } }
  else if("sharelink" in d){ if(navigator.share){ try{ await navigator.share({title:"Join me on Nerivo", url:refLink()}); }catch{} } else { try{ await navigator.clipboard.writeText(refLink()); toast("Referral link copied"); }catch{ toast(refLink()); } } }
  else if("copy" in d){ try{ await navigator.clipboard.writeText(S.profile.code||""); toast("Code copied"); }catch{ toast(S.profile.code||""); } }
  else if("go" in d && d.go==="collections"){ S.view="orders"; S.hTop="sell"; S.sTab="all"; render(); scrollTo(0,0); }
  else if("osdetail" in d){ S.detailSid=d.osdetail; S.view="sdetail"; render(); scrollTo(0,0); }
  else if("stab" in d){ S.sTab=d.stab; render(); }
  else if("go" in d){ const v = d.go==="purchases" ? "orders" : d.go; if(["balance","orders","team"].includes(v)){ S.view=v; if(v==="orders"){ S.hTab="all"; S.hTop="buy"; } render(); scrollTo(0,0); } else toast("Coming soon: "+d.go); }
  else if("mode" in d){ S.authMode=S.authMode==="login"?"register":"login"; S.err=""; S.refOk=undefined; S.refMsg=""; render(); }
  else if("auth" in d) doAuth();
  else if("logout" in d){ S.authForm={phone:"",pw:"",pw2:"",ref:""}; S.refOk=undefined; S.refMsg=""; if(DEMO){ S.user=null; render(); } else await fb.signOut(auth); }
});

render();
if(!DEMO){
  setInterval(()=>{ if(!READY && !S.user) render(); },1000);
  setTimeout(()=>{ if(!READY) showErr("Still connecting after 30 seconds. Your network may be slow or blocking Google servers. Try another network or a VPN."); },30000);
  (async()=>{
    try{
      const V = "https://www.gstatic.com/firebasejs/10.12.2/";
      const done = [];
      const ld = (n,u) => import(V+u).then(m => { done.push(n); setStatus("Downloaded: "+done.join(", ")+" (of 3)"); return m; });
      setStatus("Downloading Firebase files...");
      const [a, f, ap] = await Promise.all([ld("auth","firebase-auth.js"), ld("database","firebase-firestore.js"), ld("app","firebase-app.js")]);
      fb = { ...a, ...f };
      const app = ap.initializeApp(firebaseConfig);
      auth = a.initializeAuth(app, { persistence: [a.indexedDBLocalPersistence, a.browserLocalPersistence, a.inMemoryPersistence] });
      db = f.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
      READY = true;
    }catch(e){ showErr("Firebase could not load: "+e.message+" (check internet or VPN)"); return; }
    fb.onAuthStateChanged(auth,u=>{
      if(u && !/@nerivo\.local$/i.test(u.email||"")){ fb.signOut(auth); return; }   /* not a user-panel account (e.g. an old admin session): sign out */
      S.user=u; unsubs.forEach(x=>x()); unsubs=[]; S.view=null; S.codeChecked=false; S.codeOk=undefined; S.team=[]; S.myOrders=[]; S.sellOrders=[]; S.sheet=null;
      render();
      if(u) subscribe(u.uid);
    });
  })();
}
