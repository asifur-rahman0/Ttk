<style>
:root{--g:#0b7a55;--gd:#0a3d2e;--teal:#00a99d;--mint:#e6f4ec;--mint2:#dbf0e4;--line:#d9e2de;--mute:#7d8b86;--ink:#10231d;--bg:#fff}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:#eef2f0;color:var(--ink);display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;background:var(--bg);position:relative;padding:0 16px 120px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;margin-top:10px;background:#fff}
header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 22px) 0 16px}
header h1{flex:1;font-size:30px;font-weight:700;color:var(--gd)}
.chip{background:var(--mint);border-radius:20px;padding:10px 16px;font-size:15px;color:var(--gd)}
.hero{background:linear-gradient(135deg,var(--mint),var(--mint2));border-radius:24px;padding:22px}
.hero h2{font-size:22px}.sub{color:var(--mute);font-size:14px;margin-top:4px}
.card{border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:14px;background:#fff}
.card.on{background:#f0faf5;border-color:#bfe3d0}.card.off{background:#f2f4f8}
.list{background:var(--mint);border-radius:22px;margin-top:14px;padding:4px 14px}
.row{display:flex;align-items:center;gap:14px;padding:18px 4px;width:100%;text-align:left;font-size:18px}
.row+.row{border-top:1px solid var(--line)}.row span:nth-child(2){flex:1}
.tile{background:#fafcfb;border-radius:16px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.big{font-size:26px;font-weight:700;margin:4px 0}
.pill{display:inline-block;background:#fff;border-radius:20px;padding:10px 18px;margin:14px 8px 0 0;color:var(--gd)}
.btn{background:var(--g);color:#fff;border-radius:16px;padding:16px;font-size:17px;width:100%}
.btn.out{background:#fff;color:var(--g);border:1.5px solid var(--g)}
.btn.sm{width:auto;padding:14px 22px;font-size:15px}
button:disabled{opacity:.4;cursor:not-allowed}
.seg{display:flex;gap:10px;margin-top:16px}
.seg button{flex:1;border-radius:30px;padding:16px;background:#fff;color:var(--mute);font-size:18px}
.seg button.act{background:var(--teal);color:#fff}
.ranges{display:flex;gap:10px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.ranges button{border:1.5px solid var(--line);border-radius:14px;padding:10px 16px;white-space:nowrap;font-size:17px;color:var(--mute)}
.ranges button.act{background:var(--g);color:#fff;border-color:var(--g)}
.logo{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.bk{background:#e2136e}.ng{background:#ee4023}
.stats{display:flex;flex:1;background:#f8faf9;border-radius:14px;padding:10px 4px;text-align:center;font-size:12px;color:var(--mute)}
.stats div{flex:1}.stats b{display:block;font-size:15px;color:var(--ink)}
.flex{display:flex;align-items:center;gap:12px}.sp{flex:1}
.tag{border-radius:16px;padding:6px 14px;font-size:14px;background:#fff}
nav{position:fixed;bottom:0;width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 1.1fr 1fr 1fr;padding:8px 6px calc(env(safe-area-inset-bottom,0px) + 10px)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:14px;color:var(--mute);padding:8px 0;border-radius:24px}
nav button.act{background:var(--mint);color:var(--gd);font-weight:700}
nav .gift{background:#fff;width:76px;height:76px;border-radius:50%;margin:-40px auto 0;border:4px solid var(--g);display:grid;place-items:center;font-size:32px;padding:0;box-shadow:0 2px 12px #0002}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--gd);color:#fff;padding:12px 20px;border-radius:24px;font-size:15px;z-index:9}
.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:end center;z-index:8}
.sheet{background:#fff;width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
.auth{padding-top:15vh}.auth h1{font-size:38px;color:var(--gd)}.err{color:#c0392b;font-size:14px;margin-top:10px}
a.lnk{color:var(--g);text-decoration:underline;cursor:pointer}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
</style>
</head>

var __errs=[];
function showErr(m){__errs.push(String(m));if(__errs.length>3)__errs.shift();var d=document.getElementById('errbar')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'errbar'}));d.style.cssText='position:fixed;left:0;right:0;bottom:0;background:#c0392b;color:#fff;padding:12px 16px;font-size:13px;z-index:99;word-break:break-word';d.textContent='Error: '+__errs.join(' | ');}
addEventListener('error',function(e){showErr(e.message)});
addEventListener('unhandledrejection',function(e){showErr((e.reason&&e.reason.message)||e.reason)});

</script>

   : `<div class="empty">No orders in this range yet. Try another amount.</div>`}`;
}

function ordersView(){
  const rows = [...S.myOrders].sort((a,b)=>(b.claimedMs||0)-(a.claimedMs||0));
  const st = {reserved:["Awaiting your payment","#b26a00"],pending:["Waiting for verification","#b26a00"],done:["Approved","var(--g)"],claimed:["Approved","var(--g)"],rejected:["Rejected","#c0392b"]};
  return `<header><button data-back style="font-size:34px;color:var(--gd);padding:0 8px" aria-label="Back">‹</button><h1 style="font-size:24px">Order History</h1></header>
  ${rows.length ? rows.map(o=>{ const [t,c]=st[o.status]||[o.status,"var(--mute)"]; return `<div class="card"><div class="flex"><div class="sp"><div class="big" style="font-size:22px;margin:0">${fmt(o.amount)} BDT</div><div class="sub">${esc(o.payMethod||typeLabel(o.type))}${o.trxId?" · "+esc(o.trxId):""}</div></div><span class="tag" style="color:${c}">${t}</span></div></div>`; }).join("") : `<div class="empty">No orders yet. Claim an order from the Buy tab.</div>`}`;
}

function sheetView(){
  const sh = S.sheet, o = S.orders.find(x=>x.id===sh.id) || {};
  const m = sh.method, num = m==="bkash" ? o.bkashNumber : m==="nagad" ? o.nagadNumber : "", ml = m==="bkash" ? "bKash" : "Nagad";
  const mb = (k,l) => { const n = k==="bkash" ? o.bkashNumber : o.nagadNumber; return `<button class="btn ${m===k?"":"out"}" style="flex:1" data-method="${k}" ${n?"":"disabled"}>${l}</button>`; };
  return `<div class="modal"><div class="sheet">
    <div class="flex"><h2 class="sp" style="font-size:20px">Pay ${fmt(o.amount)} BDT</h2><button data-closesheet style="font-size:28px;padding:0 8px" aria-label="Close">×</button></div>
    <p class="sub" style="margin-top:6px">This order is reserved for you for 15 minutes. Choose the wallet you will pay with.</p>
    <div class="flex" style="margin-top:14px">${mb("bkash","bKash")}${mb("nagad","Nagad")}</div>
    ${m ? `<div class="tile" style="margin-top:14px"><div class="sub">Send exactly ${fmt(o.amount)} BDT to this ${ml} number</div>
      <div class="flex"><b class="sp" style="font-size:24px;letter-spacing:1px">${esc(num)}</b><button class="btn sm out" data-copynum="${esc(num)}">Copy</button></div></div>
      <input id="ps" type="tel" inputmode="numeric" placeholder="Your ${ml} number (sent from)" value="${esc(sh.sender)}">
      <input id="pt" placeholder="Transaction ID" autocapitalize="characters" value="${esc(sh.trx)}">
      <button class="btn" style="margin-top:14px" data-submitpay>Submit payment</button>
      <p class="sub" style="margin-top:8px;font-size:13px">Your balance is added after the admin verifies your payment.</p>` : ""}
  </div></div>`;
}

function authView(){
  if(!DEMO && !READY) return `<div class="auth"><h1>Nerivo</h1><p class="sub" style="margin-top:14px;font-size:16px">Connecting to server... ${Math.round((Date.now()-T0)/1000)}s</p><p class="sub" style="margin-top:8px">${esc(S.status||"Starting...")}</p><p class="sub" style="margin-top:8px">A slow network can take up to a minute. If it stays stuck, reload.</p><button class="btn" style="margin-top:20px" onclick="location.reload()">Reload</button></div>`;
  const reg = S.authMode==="register";
  return `<div class="auth"><h1>Nerivo</h1><p class="sub" style="margin-top:6px">${reg?"Create your account":"Log in to continue"}</p>
  ${DEMO?`<p class="sub" style="margin-top:12px;color:var(--g)">Demo mode: Firebase is not set up yet. Tap the button to preview.</p>`:""}
  <input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${reg?"new-password":"current-password"}">
  ${reg?`<input id="ph" type="tel" placeholder="Phone number"><input id="rc" placeholder="Referral code (optional)" value="${esc(REF)}">`:""}
  <div class="err">${S.err}</div>
  <button class="btn" style="margin-top:16px" data-auth>${reg?"Create account":"Log in"}</button>
  <p class="sub" style="text-align:center;margin-top:18px">${reg?"Have an account?":"New here?"} <a class="lnk" data-mode>${reg?"Log in":"Create account"}</a></p></div>`;
}

function nav(){
  const b=(k,l)=>`<button class="${S.tab===k?"act":""}" data-tab="${k}">${IC[k]}<span>${l}</span></button>`;
  return `<nav>${b("home","Home")}${b("buy","Buy")}<button class="gift" data-tab="home" aria-label="Rewards">🎁</button>${b("sell","Sell")}${b("mine","Mine")}</nav>`;
}

function render(force){
  if(S.sheet && force!==true) return;
  const app = $("#app");
  if(!S.user){ app.innerHTML = authView(); return; }
  app.innerHTML = (S.view === "team" ? teamView() : S.view === "orders" ? ordersView() : S.view ? ledgerView() : ({home,buy,sell,mine})[S.tab]()) + nav() + (S.sheet ? sheetView() : "");
}

/* ---------- Data (Firestore) ---------- */
function subscribe(uid){
  const {doc,collection,query,where,orderBy,limit,onSnapshot} = fb;
  const onS = (r,cb) => onSnapshot(r,cb,e=>showErr(e.code+": "+e.message));
  unsubs.forEach(u=>u()); unsubs=[
    onS(doc(db,"users",uid), s=>{
      S.profile = s.data()||{}; render();
      if(s.exists() && s.data().code && !S.codeChecked){ S.codeChecked = true; ensureCode(uid, s.data().code); }
      if(!s.exists() && !s.metadata.fromCache && !S.creating && !S.registering){
        S.creating = true;
        fb.setDoc(doc(db,"users",uid),{phone:"",email:S.user?.email||"",balance:0,code:rnd6(),saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()})
          .catch(e=>showErr("Profile create failed: "+e.code)).finally(()=>{ S.creating=false; });
      }
    }),
    onS(collection(db,"users",uid,"wallets"), s=>{ S.wallets = s.docs.map(d=>({id:d.id,...d.data()})); render(); }),
    onS(query(collection(db,"buyOrders"),where("status","in",["open","reserved"])), s=>{ S.orders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt)}; }); render(); }),
    onS(query(collection(db,"buyOrders"),where("claimedBy","==",uid)), s=>{ S.myOrders = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,claimedMs:ms(x.claimedAt)}; }); render(); }),
    onS(doc(db,"settings","rates"), s=>{ if(s.exists()) S.rates = s.data(); render(); }),
    onS(query(collection(db,"users",uid,"ledger"),orderBy("createdAt","desc"),limit(100)), s=>{
      S.ledger = s.docs.map(d=>{ const x=d.data(); return {id:d.id,...x,when:(x.createdAt?.toDate?.()||new Date()).toLocaleString()}; }); render(); }),
    onS(query(collection(db,"users",uid,"team"),orderBy("joinedAt","desc"),limit(200)), s=>{
      S.team = s.docs.map(d=>{ const x=d.data(); return {id:d.id,name:x.name,when:(x.joinedAt?.toDate?.()||new Date()).toLocaleDateString()}; }); render(); })
  ];
}

async function ensureCode(uid, code){
  try{
    const r = await fb.getDoc(fb.doc(db,"referralCodes",code));
    if(!r.exists()) await fb.setDoc(fb.doc(db,"referralCodes",code),{uid});
    else if(r.data().uid !== uid){ S.codeOk = false; S.codeErr = "code-taken"; render(); return; }
    S.codeOk = true;
  }catch(e){ S.codeOk = false; S.codeErr = e.code || e.message; }
  render();
}

function autoProfile(uid){
  if(S.creating) return;
  S.creating = true;
  fb.setDoc(fb.doc(db,"users",uid),{phone:"",email:S.user?.email||"",balance:0,code:rnd6(),saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()})
    .catch(e=>showErr("Profile create failed: "+e.code)).finally(()=>{ S.creating=false; });
}

async function register(email, pw){
  const phone = $("#ph").value.trim(), refCode = ($("#rc")?.value || "").trim();
  S.registering = true;
  let uid = null;
  try{
    const c = await fb.createUserWithEmailAndPassword(auth, email, pw);
    uid = c.user.uid;
    let code = "";
    for(let i=0;i<6 && !code;i++){
      const x = rnd6();
      try{ const r = await fb.getDoc(fb.doc(db,"referralCodes",x)); if(!r.exists()) code = x; }catch{ code = x; }
    }
    let refUid = null, note = "";
    if(refCode){
      try{
        const r = await fb.getDoc(fb.doc(db,"referralCodes",refCode));
        if(!r.exists()) note = "Referral code not found. The referrer must log in once with the latest app, or ask admin to link you.";
        else if(r.data().uid === uid) note = "You cannot use your own code.";
        else refUid = r.data().uid;
      }catch(e){ note = "Referral lookup failed ("+(e.code||e.message)+"). Publish the latest Firestore rules."; }
    }
    const prof = {phone,email,balance:0,code,saleAmount:0,saleOrders:0,purchaseAmount:0,purchaseOrders:0,income:0,createdAt:fb.serverTimestamp()};
    if(refUid) prof.referredBy = refUid;
    const b = fb.writeBatch(db);
    b.set(fb.doc(db,"users",uid), prof);
    b.set(fb.doc(db,"referralCodes",code), {uid});
    if(refUid) b.set(fb.doc(db,"users",refUid,"team",uid), {name:maskName(phone,email), joinedAt:fb.serverTimestamp()});
    await b.commit();
    if(note) showErr(note);
  }catch(e){
    S.registering = false;
    if(uid){ showErr("Account created but profile data failed: "+(e.code||e.message)+". Publish the latest Firestore rules."); autoProfile(uid); }
    throw e;
  }finally{ S.registering = false; }
}

async function doAuth(){
  const email=$("#em").value.trim(), pw=$("#pw").value;
  S.err="";
  if(DEMO){ S.user={uid:"demo",email:email||"demo@nerivo.app"}; demoData(); render(); return; }
  try{
    if(S.authMode==="register"){
      await register(email, pw);
    } else await fb.signInWithEmailAndPassword(auth,email,pw);
  }catch(e){ S.err = e.code==="auth/invalid-credential"?"Wrong email or password.":e.code==="auth/email-already-in-use"?"This email is already registered. Log in instead.":e.code==="auth/weak-password"?"Password must be at least 6 characters.":e.message; render(); }
}

function addWalletSheet(){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet"><h2>Add Wallet</h2><select id="wt"><option value="bkash">bKash</option><option value="nagad">Nagad</option></select><input id="wn" type="tel" placeholder="Wallet number (01XXXXXXXXX)"><div class="err" id="we"></div><button class="btn" style="margin-top:16px" id="ws">Save wallet</button><button class="btn out" style="margin-top:10px" id="wc">Cancel</button></div>`;
  document.body.append(m);
  $("#wc").onclick=()=>m.remove();
  $("#ws").onclick=async()=>{
    const type=$("#wt").value, number=$("#wn").value.trim();
    if(!/^01\d{9}$/.test(number)){ $("#we").textContent="Enter an 11-digit number starting with 01."; return; }
    const w={type,number,balance:0,online:false};
    if(DEMO) S.wallets.push({id:String(Date.now()),...w});
    else await fb.addDoc(fb.collection(db,"users",S.user.uid,"wallets"),w);
    m.remove(); render(); toast("Wallet added");
  };
}

async function toggleWallet(id){
  const w=S.wallets.find(x=>x.id===id); w.online=!w.online;
  if(!DEMO) await fb.updateDoc(fb.doc(db,"users",S.user.uid,"wallets",id),{online:w.online});
  render(); toast(w.online?"Collection started":"Wallet offline");
}

async function startClaim(id){
  const o = S.orders.find(x=>x.id===id); if(!o || S.claiming) return;
  if(isMine(o)){ S.sheet = {id, method:null, sender:"", trx:""}; render(true); return; }
  S.claiming = true;
  try{
    if(DEMO){ o.status="reserved"; o.claimedBy=S.user.uid; o.claimedMs=Date.now(); }
    else await fb.updateDoc(fb.doc(db,"buyOrders",id),{status:"reserved",claimedBy:S.user.uid,claimedAt:fb.serverTimestamp()});
    S.sheet = {id, method:null, sender:"", trx:""};
  }catch(e){
    console.error(e);
    toast("Could not reserve this order. Someone else may have taken it");
    showErr("Reserve failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

async function submitPay(){
  const sh = S.sheet, o = S.orders.find(x=>x.id===sh.id) || {};
  const sender = ($("#ps")?.value||"").trim(), trx = ($("#pt")?.value||"").trim().toUpperCase();
  sh.sender = sender; sh.trx = trx;
  if(!/^01\d{9}$/.test(sender)) return toast("Enter your 11-digit number (01XXXXXXXXX)");
  if(!/^[A-Z0-9]{6,20}$/.test(trx)) return toast("Enter a valid Transaction ID (6-20 letters or numbers)");
  if(S.claiming) return;
  S.claiming = true;
  try{
    if(DEMO){ S.myOrders.unshift({...o,status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx,claimedMs:Date.now()}); S.orders = S.orders.filter(x=>x.id!==sh.id); }
    else await fb.updateDoc(fb.doc(db,"buyOrders",sh.id),{status:"pending",payMethod:sh.method,senderNumber:sender,trxId:trx,submittedAt:fb.serverTimestamp()});
    S.sheet = null; S.view = "orders"; toast("Submitted. Waiting for admin verification");
  }catch(e){
    console.error(e);
    toast("Could not submit payment ("+(e.code||"error")+")");
    showErr("Submit failed: "+(e.code||"")+" "+e.message);
  }
  S.claiming = false; render(true);
}

/* ---------- Events ---------- */
document.addEventListener("input", e=>{ if(!S.sheet) return; if(e.target.id==="ps") S.sheet.sender=e.target.value; if(e.target.id==="pt") S.sheet.trx=e.target.value; });
document.addEventListener("click", async e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if("tab" in d){ S.tab=d.tab; S.view=null; render(); scrollTo(0,0); }
  else if("back" in d){ S.view=null; render(); }
  else if("cur" in d){ S.cur=d.cur; render(); }
  else if("range" in d){ S.range=+d.range; render(); }
  else if("claim" in d) startClaim(d.claim);
  else if("method" in d){ S.sheet.method=d.method; render(true); }
  else if("closesheet" in d){ S.sheet=null; render(true); }
  else if("submitpay" in d) submitPay();
  else if("copynum" in d){ try{ await navigator.clipboard.writeText(d.copynum); toast("Number copied"); }catch{ toast(d.copynum); } }
  else if("toggle" in d) toggleWallet(d.toggle);
  else if("sync" in d) toast("Balance refreshed");
  else if("add" in d) addWalletSheet();
  else if("copylink" in d){ try{ await navigator.clipboard.writeText(refLink()); toast("Referral link copied"); }catch{ toast(refLink()); } }
  else if("sharelink" in d){ if(navigator.share){ try{ await navigator.share({title:"Join me on Nerivo", url:refLink()}); }catch{} } else { try{ await navigator.clipboard.writeText(refLink()); toast("Referral link copied"); }catch{ toast(refLink()); } } }
  else if("copy" in d){ try{ await navigator.clipboard.writeText(S.profile.code||""); toast("Code copied"); }catch{ toast(S.profile.code||""); } }
  else if("go" in d){ if(["balance","orders","team"].includes(d.go)){ S.view=d.go; render(); scrollTo(0,0); } else toast("Coming soon: "+d.go); }
  else if("mode" in d){ S.authMode=S.authMode==="login"?"register":"login"; S.err=""; render(); }
  else if("auth" in d) doAuth();
  else if("logout" in d){ if(DEMO){ S.user=null; render(); } else await fb.signOut(auth); }
});

render();
if(!DEMO){
  setInterval(()=>{ if(!READY && !S.user) render(); },1000);
  setTimeout(()=>{ if(!READY) showErr("Still connecting after 30 seconds. Your network may be slow or blocking Google servers. Try another network or a VPN."); },30000);
  (async()=>{
    try{
      const V = "https://www.gstatic.com/firebasejs/10.12.2/";
      const done = [];
      const ld = (n,u) => import(V+u).then(m => { done.push(n); setStatus("Downloaded: "+done.join(", ")+" (of 3)"); return m; });
      setStatus("Downloading Firebase files...");
      const [a, f, ap] = await Promise.all([ld("auth","firebase-auth.js"), ld("database","firebase-firestore.js"), ld("app","firebase-app.js")]);
      fb = { ...a, ...f };
      const app = ap.initializeApp(firebaseConfig);
      auth = a.initializeAuth(app, { persistence: [a.indexedDBLocalPersistence, a.browserLocalPersistence, a.inMemoryPersistence] });
      db = f.initializeFirestore(app, { experimentalAutoDetectLongPolling: true });
      READY = true;
    }catch(e){ showErr("Firebase could not load: "+e.message+" (check internet or VPN)"); return; }
    fb.onAuthStateChanged(auth,u=>{
      S.user=u; unsubs.forEach(x=>x()); unsubs=[]; S.view=null; S.codeChecked=false; S.codeOk=undefined; S.team=[]; S.myOrders=[]; S.sheet=null;
      render();
      if(u) subscribe(u.uid);
    });
  })();
}
</script>
